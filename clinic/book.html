<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Book your appointment online." />
  <meta name="theme-color" content="#0f766e" />
  <title>Book an appointment</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f766e'/><path d='M50 22v56M22 50h56' stroke='white' stroke-width='14' stroke-linecap='round'/></svg>" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { background: #f0f4f3; }
    .bk-wrap { max-width: 820px; margin: 0 auto; padding: 24px 16px 60px; }
    .bk-hero { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
    .bk-hero .logo { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #14b8a6, #0f766e); color: #fff; display: grid; place-items: center; font-size: 22px; }
    .steps { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
    .steps span { font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: #e2e8f0; color: #64748b; }
    .steps span.done { background: var(--primary-100); color: var(--primary-600); } .steps span.cur { background: var(--primary); color: #fff; }
    .choice { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
    .choice button { text-align: left; padding: 14px; border: 1px solid var(--border); border-radius: 12px; background: #fff; cursor: pointer; transition: border-color .12s, box-shadow .12s; }
    .choice button:hover { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(15,118,110,.12); }
    .choice .t { font-weight: 650; } .choice .s { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
    .daystrip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
    .daystrip button { flex: none; width: 64px; padding: 8px 4px; border: 1px solid var(--border); border-radius: 10px; background: #fff; cursor: pointer; text-align: center; }
    .daystrip button.active { background: var(--primary); color: #fff; border-color: var(--primary); } .daystrip button:disabled { opacity: .4; cursor: default; }
    .daystrip .d { font-size: 11px; text-transform: uppercase; } .daystrip .n { font-size: 17px; font-weight: 700; }
    .summary { background: var(--primary-50); border: 1px solid var(--primary-100); border-radius: 12px; padding: 12px 14px; font-size: 13.5px; margin-bottom: 16px; }
    .back { background: none; border: 0; color: var(--primary); cursor: pointer; font-weight: 600; padding: 0; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="bk-wrap">
    <div class="bk-hero"><div class="logo">✚</div><div><h1 id="bk-name">Book an appointment</h1><div class="muted" id="bk-sub">Choose a clinic, service and time that works for you.</div></div></div>
    <div class="steps" id="bk-steps"></div>
    <div id="bk-body"></div>
    <p class="tiny muted mt-l center">Powered by ClinicFlow · <a href="index.html">Staff login</a></p>
  </div>
  <script src="store.js"></script>
  <script src="book.js"></script>
</body>
</html>
