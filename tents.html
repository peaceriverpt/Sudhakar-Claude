<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Tent Catcher — move your basket to catch the tents falling from the sky. Miss three and it's game over!" />
  <meta name="theme-color" content="#0b1026" />
  <title>Tent Catcher</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛺</text></svg>" />
  <style>
    :root {
      --sky-top: #0b1026;
      --sky-bottom: #2a3a6b;
      --accent: #ffcf4d;
      --accent-2: #63e6be;
      --danger: #ff6b6b;
      --panel: rgba(8, 12, 30, 0.55);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #05060f;
      color: #eef1ff;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    .wrap {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 10px;
      gap: 10px;
    }

    .topbar {
      width: 100%;
      max-width: 520px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    h1 {
      font-size: clamp(18px, 5vw, 26px);
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .stats {
      display: flex;
      gap: 8px;
    }

    .stat {
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 5px 10px;
      min-width: 56px;
      text-align: center;
      line-height: 1.1;
    }

    .stat .label {
      display: block;
      font-size: 9px;
      letter-spacing: 1.5px;
      opacity: 0.65;
    }

    .stat .value {
      display: block;
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
    }

    #lives { color: var(--danger); letter-spacing: 2px; }

    .stage {
      position: relative;
      width: 100%;
      max-width: 520px;
      flex: 1 1 auto;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 16px;
      padding: 24px;
      background: rgba(5, 6, 15, 0.72);
      backdrop-filter: blur(3px);
    }

    .overlay.hidden { display: none; }

    .overlay h2 {
      font-size: clamp(26px, 8vw, 42px);
      color: var(--accent);
      text-shadow: 0 3px 18px rgba(255, 207, 77, 0.35);
    }

    .overlay p { max-width: 340px; opacity: 0.85; line-height: 1.5; }
    .overlay .big { font-size: 20px; opacity: 1; }
    .overlay .big b { color: var(--accent-2); }

    button.play {
      appearance: none;
      border: none;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      font-size: 18px;
      color: #05060f;
      background: linear-gradient(180deg, var(--accent), #f5a623);
      padding: 14px 30px;
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(245, 166, 35, 0.4);
      transition: transform 0.08s ease, box-shadow 0.2s ease;
    }
    button.play:active { transform: translateY(2px) scale(0.98); }

    .hint {
      font-size: 12px;
      opacity: 0.6;
      text-align: center;
      max-width: 520px;
    }

    kbd {
      background: rgba(255,255,255,0.12);
      border-radius: 5px;
      padding: 1px 6px;
      font-family: inherit;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <h1>⛺ Tent Catcher</h1>
      <div class="stats">
        <div class="stat"><span class="label">SCORE</span><span class="value" id="score">0</span></div>
        <div class="stat"><span class="label">BEST</span><span class="value" id="best">0</span></div>
        <div class="stat"><span class="label">LIVES</span><span class="value" id="lives">❤❤❤</span></div>
      </div>
    </div>

    <div class="stage">
      <canvas id="game"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="ovTitle">⛺ Tent Catcher</h2>
        <p id="ovText">Tents are falling from the sky! Slide your basket to catch them before they hit the ground. Miss <b>3</b> and it's game over.</p>
        <p class="big" id="ovScore"></p>
        <button class="play" id="playBtn">Play</button>
      </div>
    </div>

    <p class="hint">Move: <kbd>←</kbd> <kbd>→</kbd> or <kbd>A</kbd> <kbd>D</kbd> &middot; on mobile, drag or just touch where you want the basket &middot; <kbd>P</kbd> to pause</p>
  </div>

  <script>
  (function () {
    "use strict";

    var canvas = document.getElementById("game");
    var ctx = canvas.getContext("2d");
    var overlay = document.getElementById("overlay");
    var ovTitle = document.getElementById("ovTitle");
    var ovText = document.getElementById("ovText");
    var ovScore = document.getElementById("ovScore");
    var playBtn = document.getElementById("playBtn");
    var scoreEl = document.getElementById("score");
    var bestEl = document.getElementById("best");
    var livesEl = document.getElementById("lives");

    // Logical resolution; the canvas is scaled to fit the stage via CSS.
    var W = 0, H = 0, DPR = 1;

    var STATE = { MENU: 0, PLAYING: 1, PAUSED: 2, OVER: 3 };
    var state = STATE.MENU;

    var best = 0;
    try { best = parseInt(localStorage.getItem("tentCatcherBest") || "0", 10) || 0; } catch (e) {}
    bestEl.textContent = best;

    var basket, tents, score, lives, spawnTimer, spawnEvery, fallSpeed, elapsed;
    var keys = { left: false, right: false };
    var pointerX = null; // target x when dragging/touching

    function resize() {
      var rect = canvas.getBoundingClientRect();
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      W = Math.max(240, rect.width);
      H = Math.max(320, rect.height);
      canvas.width = Math.round(W * DPR);
      canvas.height = Math.round(H * DPR);
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      if (basket) {
        basket.w = Math.max(66, W * 0.18);
        basket.h = basket.w * 0.62;
        basket.y = H - basket.h - 14;
        basket.x = Math.min(Math.max(basket.x, basket.w / 2), W - basket.w / 2);
      }
    }

    function reset() {
      var bw = Math.max(66, W * 0.18);
      basket = { x: W / 2, y: 0, w: bw, h: bw * 0.62, speed: W * 0.9 };
      basket.y = H - basket.h - 14;
      tents = [];
      score = 0;
      lives = 3;
      elapsed = 0;
      spawnEvery = 1.15;      // seconds between tents (shrinks over time)
      spawnTimer = 0.4;
      fallSpeed = H * 0.30;   // px per second (grows over time)
      pointerX = null;
      updateHud();
    }

    function updateHud() {
      scoreEl.textContent = score;
      var hearts = "";
      for (var i = 0; i < 3; i++) hearts += i < lives ? "❤" : "·";
      livesEl.textContent = hearts;
    }

    function spawnTent() {
      var s = Math.max(30, W * 0.09);
      var x = s / 2 + Math.random() * (W - s);
      // Occasional golden tent worth bonus points.
      var golden = Math.random() < 0.12;
      tents.push({
        x: x, y: -s, size: s,
        vy: fallSpeed * (0.85 + Math.random() * 0.4),
        sway: (Math.random() - 0.5) * 0.6,
        phase: Math.random() * Math.PI * 2,
        golden: golden,
        rot: (Math.random() - 0.5) * 0.4
      });
    }

    // ---- Input ----
    function onKeyDown(e) {
      var k = e.key.toLowerCase();
      if (k === "arrowleft" || k === "a") { keys.left = true; pointerX = null; }
      else if (k === "arrowright" || k === "d") { keys.right = true; pointerX = null; }
      else if (k === "p") { togglePause(); }
      else if (k === " " || k === "enter") {
        if (state === STATE.MENU || state === STATE.OVER) startGame();
      }
      if (["arrowleft","arrowright"," "].indexOf(e.key.toLowerCase()) >= 0) e.preventDefault();
    }
    function onKeyUp(e) {
      var k = e.key.toLowerCase();
      if (k === "arrowleft" || k === "a") keys.left = false;
      else if (k === "arrowright" || k === "d") keys.right = false;
    }

    function pointerPos(e) {
      var rect = canvas.getBoundingClientRect();
      var cx = (e.touches ? e.touches[0].clientX : e.clientX);
      return (cx - rect.left) / rect.width * W;
    }
    function onPointerDown(e) {
      if (state !== STATE.PLAYING) return;
      pointerX = pointerPos(e);
      e.preventDefault();
    }
    function onPointerMove(e) {
      if (state !== STATE.PLAYING || pointerX === null) return;
      pointerX = pointerPos(e);
      e.preventDefault();
    }
    function onPointerUp() { pointerX = null; }

    window.addEventListener("keydown", onKeyDown);
    window.addEventListener("keyup", onKeyUp);
    canvas.addEventListener("mousedown", onPointerDown);
    window.addEventListener("mousemove", onPointerMove);
    window.addEventListener("mouseup", onPointerUp);
    canvas.addEventListener("touchstart", onPointerDown, { passive: false });
    canvas.addEventListener("touchmove", onPointerMove, { passive: false });
    window.addEventListener("touchend", onPointerUp);
    window.addEventListener("resize", resize);

    playBtn.addEventListener("click", startGame);

    function togglePause() {
      if (state === STATE.PLAYING) {
        state = STATE.PAUSED;
        showOverlay("Paused", "Take a breather.", "Press P or Play to resume.");
      } else if (state === STATE.PAUSED) {
        hideOverlay();
        state = STATE.PLAYING;
      }
    }

    function startGame() {
      resize();
      reset();
      hideOverlay();
      state = STATE.PLAYING;
    }

    function gameOver() {
      state = STATE.OVER;
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        try { localStorage.setItem("tentCatcherBest", String(best)); } catch (e) {}
      }
      showOverlay("Game Over", "Three tents got away!", "You caught tents worth <b>" + score + "</b> points.");
      playBtn.textContent = "Play again";
    }

    function showOverlay(title, text, scoreLine) {
      ovTitle.textContent = title;
      ovText.innerHTML = text;
      ovScore.innerHTML = scoreLine || "";
      overlay.classList.remove("hidden");
    }
    function hideOverlay() { overlay.classList.add("hidden"); }

    // ---- Update ----
    function update(dt) {
      elapsed += dt;

      // Difficulty ramps up gradually.
      fallSpeed = H * (0.30 + Math.min(0.55, elapsed * 0.012));
      spawnEvery = Math.max(0.42, 1.15 - elapsed * 0.02);

      // Move basket.
      if (pointerX !== null) {
        var diff = pointerX - basket.x;
        var step = basket.speed * dt;
        if (Math.abs(diff) <= step) basket.x = pointerX;
        else basket.x += Math.sign(diff) * step;
      } else {
        if (keys.left) basket.x -= basket.speed * dt;
        if (keys.right) basket.x += basket.speed * dt;
      }
      basket.x = Math.min(Math.max(basket.x, basket.w / 2), W - basket.w / 2);

      // Spawn tents.
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnTent();
        spawnTimer = spawnEvery * (0.75 + Math.random() * 0.5);
      }

      // Move + resolve tents.
      var catchTop = basket.y + basket.h * 0.15;
      var catchLeft = basket.x - basket.w / 2;
      var catchRight = basket.x + basket.w / 2;

      for (var i = tents.length - 1; i >= 0; i--) {
        var t = tents[i];
        t.y += t.vy * dt;
        t.phase += dt * 3;
        t.x += Math.sin(t.phase) * t.sway;
        t.x = Math.min(Math.max(t.x, t.size / 2), W - t.size / 2);

        var bottom = t.y + t.size / 2;
        // Caught? tent's base overlaps the basket mouth horizontally + vertically.
        if (bottom >= catchTop && bottom <= basket.y + basket.h &&
            t.x > catchLeft && t.x < catchRight) {
          tents.splice(i, 1);
          score += t.golden ? 5 : 1;
          updateHud();
          continue;
        }
        // Missed — hit the ground.
        if (t.y - t.size / 2 > H) {
          tents.splice(i, 1);
          lives -= 1;
          updateHud();
          if (lives <= 0) { gameOver(); return; }
        }
      }
    }

    // ---- Render ----
    function drawBackground() {
      var g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, "#0b1026");
      g.addColorStop(1, "#2a3a6b");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      // Static-ish stars based on position (cheap, no allocation).
      ctx.fillStyle = "rgba(255,255,255,0.55)";
      for (var i = 0; i < 40; i++) {
        var sx = (i * 97.13) % W;
        var sy = (i * 53.7) % (H * 0.75);
        var tw = 0.6 + (Math.sin(elapsed * 2 + i) + 1) * 0.5;
        ctx.globalAlpha = 0.15 + tw * 0.25;
        ctx.fillRect(sx, sy, 2, 2);
      }
      ctx.globalAlpha = 1;

      // Ground line.
      ctx.fillStyle = "rgba(0,0,0,0.25)";
      ctx.fillRect(0, H - 6, W, 6);
    }

    function drawTent(t) {
      var s = t.size;
      ctx.save();
      ctx.translate(t.x, t.y);
      ctx.rotate(t.rot);
      var half = s / 2;
      // Body (triangle).
      ctx.beginPath();
      ctx.moveTo(0, -half);
      ctx.lineTo(half, half);
      ctx.lineTo(-half, half);
      ctx.closePath();
      ctx.fillStyle = t.golden ? "#ffd54a" : "#e05a47";
      ctx.fill();
      // Shaded right side.
      ctx.beginPath();
      ctx.moveTo(0, -half);
      ctx.lineTo(half, half);
      ctx.lineTo(0, half);
      ctx.closePath();
      ctx.fillStyle = t.golden ? "#f5b800" : "#b8412f";
      ctx.fill();
      // Door.
      ctx.beginPath();
      ctx.moveTo(0, -half * 0.15);
      ctx.lineTo(half * 0.28, half);
      ctx.lineTo(-half * 0.28, half);
      ctx.closePath();
      ctx.fillStyle = "rgba(0,0,0,0.45)";
      ctx.fill();
      // Pole tip.
      ctx.fillStyle = t.golden ? "#fff2b0" : "#ffd7cf";
      ctx.fillRect(-1.2, -half - 4, 2.4, 6);
      ctx.restore();
    }

    function drawBasket() {
      var x = basket.x, y = basket.y, w = basket.w, h = basket.h;
      var left = x - w / 2, right = x + w / 2;
      ctx.save();
      // Rim.
      ctx.fillStyle = "#a9743c";
      ctx.beginPath();
      roundRect(left - 4, y - 6, w + 8, 12, 6);
      ctx.fill();
      // Body (trapezoid).
      ctx.beginPath();
      ctx.moveTo(left, y);
      ctx.lineTo(right, y);
      ctx.lineTo(right - w * 0.10, y + h);
      ctx.lineTo(left + w * 0.10, y + h);
      ctx.closePath();
      ctx.fillStyle = "#c8873f";
      ctx.fill();
      // Horizontal weave lines.
      ctx.strokeStyle = "rgba(80,45,15,0.55)";
      ctx.lineWidth = 2;
      for (var i = 1; i <= 3; i++) {
        var inset = w * 0.10 * (i / 4);
        var yy = y + (h * i / 4);
        ctx.beginPath();
        ctx.moveTo(left + inset, yy);
        ctx.lineTo(right - inset, yy);
        ctx.stroke();
      }
      // Vertical weave lines (converging toward the narrower base).
      for (var j = 1; j < 6; j++) {
        var topX = left + (w * j / 6);
        var frac = (topX - x) / (w / 2);           // -1..1 across the rim
        var botX = x + frac * (w / 2 - w * 0.10);   // pull toward the trapezoid base
        ctx.beginPath();
        ctx.moveTo(topX, y);
        ctx.lineTo(botX, y + h);
        ctx.stroke();
      }
      ctx.restore();
    }

    function roundRect(x, y, w, h, r) {
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
    }

    function render() {
      drawBackground();
      for (var i = 0; i < tents.length; i++) drawTent(tents[i]);
      drawBasket();
    }

    // ---- Loop ----
    var last = 0;
    function frame(now) {
      if (!last) last = now;
      var dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      if (state === STATE.PLAYING) update(dt);
      if (state !== STATE.MENU) render();
      else drawBackground();
      requestAnimationFrame(frame);
    }

    // Boot.
    resize();
    reset();
    state = STATE.MENU;
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
